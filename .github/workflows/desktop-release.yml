name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && (sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2)

      - name: Build web & CLI
        run: pnpm run build

      - name: Build Electron Desktop App (Linux)
        if: runner.os == 'Linux'
        run: pnpm electron-builder --linux AppImage --linux deb --linux tar.gz

      - name: Build Electron Desktop App (Windows)
        if: runner.os == 'Windows'
        run: pnpm electron-builder --win zip --win portable

      - name: Build Electron Desktop App (macOS)
        if: runner.os == 'macOS'
        run: pnpm electron-builder --mac zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quotalens-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.exe
            release/*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.exe
            release/*.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
